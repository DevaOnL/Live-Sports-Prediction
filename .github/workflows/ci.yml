name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sports_test
          POSTGRES_USER: sports_bootstrap
          POSTGRES_PASSWORD: ci-only-bootstrap-password
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sports_bootstrap -d sports_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      mongo:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: bootstrap
          MONGO_INITDB_ROOT_PASSWORD: ci-only-mongo-bootstrap-password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sports_test
      POSTGRES_USER: sports_bootstrap
      # These passwords belong only to the disposable CI service.
      POSTGRES_BOOTSTRAP_PASSWORD: ci-only-bootstrap-password
      POSTGRES_READER_PASSWORD: ci-only-reader-password
      POSTGRES_WRITER_PASSWORD: ci-only-writer-password
      POSTGRES_AUTH_PASSWORD: ci-only-auth-password
      POSTGRES_MIGRATOR_PASSWORD: ci-only-migrator-password
      MONGO_HOST: 127.0.0.1
      MONGO_PORT: "27017"
      MONGO_DB: sports_test
      MONGO_TEST_PORT: "27017"
      MONGO_TEST_DATABASE: sports_test
      MONGO_BOOTSTRAP_USER: bootstrap
      MONGO_BOOTSTRAP_PASSWORD: ci-only-mongo-bootstrap-password
      MONGO_WORKER_USER: lsp_ingestion
      MONGO_WORKER_PASSWORD: ci-only-mongo-worker-password
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Identify the disposable PostgreSQL cluster
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          test_cluster_id=$(docker exec "$POSTGRES_CONTAINER" psql -U sports_bootstrap -d sports_test -Atqc 'SELECT system_identifier::text FROM pg_control_system()')
          printf 'POSTGRES_TEST_CLUSTER_ID=%s\n' "$test_cluster_id" >> "$GITHUB_ENV"
      - name: Verify migrations, constraints, and database roles
        run: npm run test:db
      - name: Identify the disposable MongoDB container
        env:
          MONGO_CONTAINER: ${{ job.services.mongo.id }}
        run: |
          mongo_test_host=$(docker exec "$MONGO_CONTAINER" hostname)
          printf 'MONGO_TEST_HOST_ID=%s\n' "$mongo_test_host" >> "$GITHUB_ENV"
      - name: Verify archives, ingestion, recovery, and jobs
        run: npm run test:ingestion
