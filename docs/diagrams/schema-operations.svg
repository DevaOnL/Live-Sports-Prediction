<svg xmlns="http://www.w3.org/2000/svg" width="2940.51" height="1735" viewBox="0 0 2940.51 1735" role="img" aria-labelledby="schema-title schema-description">
<title id="schema-title">Relational schema 4/5: Processing and infrastructure</title>
<desc id="schema-description">Horizontal relational schema, sheet 4 of five. Processing and infrastructure. Full rows contain every stored attribute; solid underlines mark primary-key components. Each F-number is one whole ordered foreign key, joined by source and target component buses. Gray rows are referenced key subsets from the named schema sheet. Types, nullability, ordered tuples, checks and context rules are in relational-schema.md.</desc>
<defs><marker id="fk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#626b64"/></marker></defs>
<rect width="100%" height="100%" fill="#fffdf8"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#202620">
<text x="34" y="50" font-size="30" font-weight="600">RELATIONAL SCHEMA · 4/5 · Processing and infrastructure</text>
<text x="34" y="91" font-size="22">One named horizontal strip per relation. Underlined attributes form one combined primary key.</text>
<text x="34" y="126" font-size="22">Each Fnn arrow represents one whole ordered FK tuple; joined ticks show every source and target component.</text>
<text x="34" y="161" font-size="22">Gray strips repeat only referenced key attributes. Types, nullability and full constraints: relational-schema.md.</text>
