<title id="schema-title">Relational schema 4/5: Processing and infrastructure</title>
<desc id="schema-description">Relational schema 4 of five: Processing and infrastructure. Clark Figure 8.14 notation: gray horizontal attribute rows, uppercase relation names, underlined primary-key components and black foreign-key arrows pointing to referenced columns. Each composite foreign key has one branching connector and one shared trunk; column order is recorded in metadata and the relational schema dictionary. Full rows labeled cross-sheet reference repeat a relation from its principal sheet, not another stored relation. Types, nullability, UNIQUE and CHECK constraints are in relational-schema.md.</desc>
